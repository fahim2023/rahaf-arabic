<div class="field{% if field.errors %} has-error{% endif %}{% if full %} full{% endif %}">
  <label for="{{ field.id_for_label }}">{{ field.label }}{% if hint %} <span style="font-weight:500;color:var(--muted-2)">{{ hint }}</span>{% endif %}</label>
  {{ field }}
  {% if field.help_text %}<span class="help">{{ field.help_text }}</span>{% endif %}
  {{ field.errors }}
</div>
